services:
  - type: web
    name: localgpt-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./localgpt_phase3.db
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: hosted_endpoint
      - key: HOSTED_LLM_API_BASE
        value: https://api.groq.com/openai/v1
      - key: HOSTED_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: HOSTED_LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
